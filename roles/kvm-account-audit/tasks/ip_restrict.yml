---
- name: kvm_ip_restrict 점검 근거 시작
  ansible.builtin.set_fact:
    security_policy_evidence:
      kvm_ip_restrict:
        name: kvm_ip_restrict
        status: '{{ ''unknown'' if (enable_kvm_ip_restrict | bool) else ''not_run'' }}'
        observed: 최종 유효 상태의 자동 판정 근거 없음
        expected: 기능별 정책 충족
  tags:
  - kvm_ip_restrict
- name: KVM IP 접근 제한 report
  ansible.builtin.debug:
    msg:
    - enable_kvm_ip_restrict={{ enable_kvm_ip_restrict }}
    - firewall_backend={{ firewall_backend }}
    - firewall_apply_mode={{ firewall_apply_mode }}
    - allowed_management_cidrs={{ allowed_management_cidrs | join(',') }}
    - emergency_access_cidrs={{ emergency_access_cidrs | join(',') }}
    - enable_default_deny={{ enable_default_deny }}
  when: enable_kvm_ip_restrict | bool
  tags:
  - kvm_ip_restrict
- name: KVM IP 접근 제한 backend 확인
  ansible.builtin.assert:
    that:
    - firewall_backend == 'ufw'
    fail_msg: Ubuntu 24.04 implementation currently supports enforce mode only for ufw.
  when:
  - enable_kvm_ip_restrict | bool
  - security_action_mode == 'enforce'
  - firewall_apply_mode == 'enforce'
  tags:
  - kvm_ip_restrict
- name: KVM ufw 패키지 설치
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
  - enable_kvm_ip_restrict | bool
  - security_action_mode == 'enforce'
  - firewall_apply_mode == 'enforce'
  - firewall_backend == 'ufw'
  - apply_policy | default(false) | bool
  tags:
  - kvm_ip_restrict
- name: KVM 관리망 SSH 허용
  become: true
  register: kvm_ufw_allow_result
  loop: '{{ (allowed_management_cidrs + emergency_access_cidrs) | product(allowed_service_ports) | list }}'
  when:
  - enable_kvm_ip_restrict | bool
  - security_action_mode == 'enforce'
  - firewall_apply_mode == 'enforce'
  - firewall_backend == 'ufw'
  - apply_policy | default(false) | bool
  tags:
  - kvm_ip_restrict
  community.general.ufw:
    rule: allow
    from_ip: '{{ item.0 }}'
    to_port: '{{ item.1.port | string }}'
    proto: '{{ item.1.proto | default(''tcp'') }}'
- name: KVM ufw 기본 inbound 정책 적용
  become: true
  register: kvm_ufw_default_result
  when:
  - enable_kvm_ip_restrict | bool
  - security_action_mode == 'enforce'
  - firewall_apply_mode == 'enforce'
  - firewall_backend == 'ufw'
  - enable_default_deny | bool
  - apply_policy | default(false) | bool
  tags:
  - kvm_ip_restrict
  community.general.ufw:
    direction: incoming
    policy: '{{ default_inbound_policy }}'
- name: KVM ufw 활성화
  become: true
  register: kvm_ufw_enable_result
  when:
  - enable_kvm_ip_restrict | bool
  - security_action_mode == 'enforce'
  - firewall_apply_mode == 'enforce'
  - firewall_backend == 'ufw'
  - apply_policy | default(false) | bool
  tags:
  - kvm_ip_restrict
  community.general.ufw:
    state: enabled
