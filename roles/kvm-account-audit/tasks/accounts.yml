---
- name: KVM 계정 정책 변수 호환성 설정
  ansible.builtin.set_fact:
    kvm_accounts_effective_target_groups: '{{ kvm_account_audit.target_groups | default(kvm_account_target_groups)
      }}'
    kvm_accounts_effective_inactivity_days: '{{ kvm_account_audit.inactivity_threshold_days | default(kvm_account_inactivity_threshold_days)
      }}'
    kvm_accounts_effective_restriction_days: '{{ kvm_account_audit.restriction_threshold_days | default(kvm_account_restriction_threshold_days)
      }}'
  tags:
  - kvm_accounts
- name: KVM 계정과 기본/보조 그룹 및 로그인 이력 조회
  kvm_account_info:
    groups: '{{ kvm_accounts_effective_target_groups }}'
    protected: '{{ (kvm_allowed_users + kvm_account_excluded_users + [''root'', ansible_user | default(''ansible'')])
      | unique }}'
    retired: '{{ kvm_retired_users }}'
    uid_min: '{{ kvm_uid_min }}'
    inactivity_days: '{{ kvm_accounts_effective_inactivity_days }}'
    restriction_days: '{{ kvm_accounts_effective_restriction_days }}'
  register: kvm_account_scan
  when: enable_kvm_account_hardening | bool
  tags:
  - kvm_accounts
- name: KVM 계정 판정 결과 저장
  ansible.builtin.set_fact:
    inactivity_accounts: '{{ kvm_account_scan.inactive }}'
    kvm_lock_target_accounts: '{{ kvm_account_scan.lock_targets }}'
    kvm_delete_target_accounts: '{{ kvm_account_scan.delete_targets }}'
    locked_accounts: []
    deleted_accounts: []
  when: enable_kvm_account_hardening | bool
  tags:
  - kvm_accounts
- name: KVM 계정 점검 불가 및 미사용 결과
  ansible.builtin.debug:
    msg:
      inactive: '{{ kvm_account_scan.inactive }}'
      unknown: '{{ kvm_account_scan.unknown }}'
  when: enable_kvm_account_hardening | bool
  tags:
  - kvm_accounts
- name: KVM 계정 잠금 처리
  ansible.builtin.user:
    name: '{{ item }}'
    password_lock: true
    shell: '{{ kvm_nologin_shell }}'
  loop: '{{ kvm_lock_target_accounts | default([]) }}'
  become: true
  register: kvm_lock_result
  when:
  - enable_kvm_account_hardening | bool
  - security_action_mode == 'enforce'
  - kvm_account_action == 'lock'
  - apply_policy | default(false) | bool
  tags:
  - kvm_accounts
- name: KVM 계정 삭제 처리
  ansible.builtin.user:
    name: '{{ item }}'
    state: absent
    remove: '{{ kvm_remove_home | bool }}'
  loop: '{{ kvm_delete_target_accounts | default([]) }}'
  become: true
  register: kvm_delete_result
  when:
  - enable_kvm_account_hardening | bool
  - security_action_mode == 'delete'
  - kvm_account_action == 'delete'
  - apply_policy | default(false) | bool
  tags:
  - kvm_accounts
- name: KVM 계정 조치 결과 변수 생성
  ansible.builtin.set_fact:
    locked_accounts: '{{ kvm_lock_result.results | default([]) | selectattr(''changed'', ''equalto'', true) | map(attribute=''item'')
      | list }}'
    deleted_accounts: '{{ kvm_delete_result.results | default([]) | selectattr(''changed'', ''equalto'', true) |
      map(attribute=''item'') | list }}'
  when: enable_kvm_account_hardening | bool
  tags:
  - kvm_accounts
- name: KVM 계정 수동 조치 스크립트 배포
  ansible.builtin.template:
    src: apply_account_restrictions.j2
    dest: '{{ kvm_account_manual_script_dir }}/apply_account_restrictions_{{ ansible_date_time.iso8601_basic_short
      }}.sh'
    owner: root
    group: root
    mode: '0750'
  become: true
  when:
  - enable_kvm_account_hardening | bool
  - kvm_account_manual_script_enabled | bool
  - inactivity_accounts | default([]) | length > 0
  - apply_policy | default(false) | bool
  - security_action_mode == 'enforce'
  tags:
  - kvm_accounts
- name: KVM 계정 정책 완료
  ansible.builtin.debug:
    msg:
    - report=security_report_callback
    - locked={{ locked_accounts | default([]) | join(',') }}
    - deleted={{ deleted_accounts | default([]) | join(',') }}
  when: enable_kvm_account_hardening | bool
  tags:
  - kvm_accounts
