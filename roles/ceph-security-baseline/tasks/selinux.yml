---
- name: ceph_selinux 점검 근거 시작
  ansible.builtin.set_fact:
    security_policy_evidence:
      ceph_selinux:
        name: ceph_selinux
        status: '{{ ''unknown'' if (enable_ceph_selinux | bool or ceph_selinux_report_avc | bool) else ''not_run''
          }}'
        observed: 최종 유효 상태의 자동 판정 근거 없음
        expected: 기능별 정책 충족
  tags:
  - ceph_selinux
- name: Ceph SELinux 상태 조회
  ansible.builtin.command:
    argv:
    - sestatus
  register: ceph_selinux_status
  changed_when: false
  failed_when: false
  when: ceph_selinux_report_avc | bool or enable_ceph_selinux | bool
  tags:
  - ceph_selinux
  check_mode: false
- name: Ceph SELinux AVC 로그 조회
  ansible.builtin.command:
    argv:
    - ausearch
    - -m
    - avc
    - -ts
    - recent
  register: ceph_selinux_avc
  changed_when: false
  failed_when: false
  when: ceph_selinux_report_avc | bool
  tags:
  - ceph_selinux
  check_mode: false
- name: Ceph SELinux report
  ansible.builtin.debug:
    msg:
    - enable_ceph_selinux={{ enable_ceph_selinux }}
    - state={{ ceph_selinux_state }}
    - policy={{ ceph_selinux_policy }}
    - allow_reboot={{ ceph_selinux_allow_reboot }}
    - '{{ ceph_selinux_status.stdout_lines | default([]) }}'
    - '{{ ceph_selinux_avc.stdout_lines | default([]) }}'
  when: ceph_selinux_report_avc | bool or enable_ceph_selinux | bool
  tags:
  - ceph_selinux
- name: Ceph SELinux 패키지 설치
  ansible.builtin.apt:
    name:
    - selinux-basics
    - selinux-policy-default
    - auditd
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
  - enable_ceph_selinux | bool
  - ceph_selinux_install_packages | bool
  - security_action_mode == 'enforce'
  - apply_policy | default(false) | bool
  tags:
  - ceph_selinux
- name: Ceph SELinux 실행 모드 조회
  ansible.builtin.command:
    argv:
    - getenforce
  register: ceph_selinux_current
  changed_when: false
  check_mode: false
  when: enable_ceph_selinux | bool
  tags:
  - ceph_selinux
- name: Ceph SELinux 비활성 환경 전환 방지
  ansible.builtin.assert:
    that:
    - ceph_selinux_current.stdout | trim | lower in ['enforcing', 'permissive']
    - ceph_selinux_state in ['enforcing', 'permissive']
    fail_msg: SELinux 활성 환경의 상태 변경만 지원합니다. 최초 활성화는 별도 운영 절차가 필요합니다.
  when:
  - enable_ceph_selinux | bool
  - apply_policy | default(false) | bool
  - security_action_mode == 'enforce'
  tags:
  - ceph_selinux
- name: Ceph SELinux 상태 설정
  ansible.builtin.command:
    argv:
    - setenforce
    - '{{ ''1'' if ceph_selinux_state == ''enforcing'' else ''0'' }}'
  register: ceph_setenforce_result
  changed_when: ceph_setenforce_result.rc == 0
  failed_when:
  - ceph_setenforce_result.rc != 0
  - ceph_selinux_state != 'disabled'
  become: true
  when:
  - enable_ceph_selinux | bool
  - security_action_mode == 'enforce'
  - ceph_selinux_state in ['permissive', 'enforcing']
  - apply_policy | default(false) | bool
  - ceph_selinux_current.stdout | trim | lower != ceph_selinux_state
  tags:
  - ceph_selinux
- name: Ceph SELinux 영구 모드 설정
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: ^SELINUX=
    line: SELINUX={{ ceph_selinux_state }}
    backup: true
  when:
  - enable_ceph_selinux | bool
  - apply_policy | default(false) | bool
  - security_action_mode == 'enforce'
  tags:
  - ceph_selinux
