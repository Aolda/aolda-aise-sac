---
- name: kvm_log_backup 점검 근거 시작
  ansible.builtin.set_fact:
    security_policy_evidence:
      kvm_log_backup:
        name: kvm_log_backup
        status: '{{ ''unknown'' if (enable_kvm_log_backup | bool) else ''not_run'' }}'
        observed: 최종 유효 상태의 자동 판정 근거 없음
        expected: 기능별 정책 충족
  tags:
  - kvm_log_backup
- name: KVM 기존 로그 교체 설정 중복 조회
  security_logrotate_info:
    own_config: '{{ kvm_logrotate_config_path }}'
    patterns: '{{ kvm_log_paths }}'
  register: kvm_logrotate_conflicts
  when: enable_kvm_log_backup | bool
  tags:
  - kvm_log_backup
- name: KVM 중복 로그 교체 설정 적용 방지
  ansible.builtin.assert:
    that:
    - kvm_logrotate_conflicts.conflicts | length == 0
    fail_msg: 기존 로그 교체 설정과 대상 경로가 겹칩니다. 중복을 해소한 후 적용하십시오.
  when:
  - enable_kvm_log_backup | bool
  - apply_policy | default(false) | bool
  - security_action_mode == 'enforce'
  tags:
  - kvm_log_backup
- name: KVM 로그 관리 report
  ansible.builtin.debug:
    msg:
    - enable_kvm_log_backup={{ enable_kvm_log_backup }}
    - paths={{ kvm_log_paths | join(',') }}
    - period={{ kvm_log_rotate_period }}
    - rotate={{ kvm_log_rotate_count }}
    - compress={{ kvm_log_compress }}
    - remote_backup={{ kvm_log_backup_enabled }}
    - mode={{ security_action_mode }}
  when: enable_kvm_log_backup | bool
  tags:
  - kvm_log_backup
- name: KVM logrotate 설정 배포
  ansible.builtin.template:
    src: libvirt-security.logrotate.j2
    dest: '{{ kvm_logrotate_config_path }}'
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/logrotate -d %s
  become: true
  when:
  - enable_kvm_log_backup | bool
  - security_action_mode == 'enforce'
  - apply_policy | default(false) | bool
  tags:
  - kvm_log_backup
- name: KVM 별도 로그 스냅샷 실행
  ansible.builtin.import_tasks: log_snapshot.yml
  tags:
  - kvm_log_backup
