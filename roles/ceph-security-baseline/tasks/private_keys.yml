---
- name: Ceph SSH 개인키 파일 조회
  ansible.builtin.find:
    paths: '{{ item.value }}/.ssh'
    patterns:
    - id_*
    excludes:
    - '*.pub'
    - '*authorized_keys'
    - '*known_hosts'
    file_type: file
    follow: false
  loop: '{{ ceph_ssh_user_homes | default({}) | dict2items }}'
  register: ceph_private_keys
  when: enable_ceph_ssh_key_check | bool
  tags:
  - ceph_ssh_keys
- name: Ceph SSH 개인키 권한 적용
  ansible.builtin.file:
    path: '{{ item.path }}'
    mode: '{{ ceph_private_key_mode }}'
    state: file
    follow: false
  loop: '{{ ceph_private_keys.results | default([]) | selectattr(''files'', ''defined'') | map(attribute=''files'')
    | flatten }}'
  become: true
  when:
  - enable_ceph_ssh_key_check | bool
  - security_action_mode == 'enforce'
  - apply_policy | default(false) | bool
  tags:
  - ceph_ssh_keys
